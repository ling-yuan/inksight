[platformio]
default_envs = epd_398_huawei_bwry_c3_promini

[env:epd_398_huawei_bwry_c3_promini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:merge_firmware.py
build_flags =
    -DBOARD_PROFILE_ESP32_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_398_HUAWEI
    -DEPD_BPP=2
